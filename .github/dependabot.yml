version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      bagimliliklar:
        patterns: ['*']
        update-types: [minor, patch]
    # Büyük sürüm atlamaları (ör. Vite 8) elle, uyumluluk kontrol edilerek yapılır.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
